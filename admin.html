<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza Hut Taranagar - Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5f5;
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 420px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #ddd;
    }
    h1 { color: #c62828; text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
    }
    button {
      background: #c62828;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🍕 Admin Panel</h1>
    <p>अपने Admin ईमेल और पासवर्ड से लॉगिन करें।</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Admin Email" required>
      <input id="password" type="password"
        placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("message").textContent =
        "Firebase कनेक्शन अभी सेट नहीं हुआ है। कृपया अगले सेटअप स्टेप तक प्रतीक्षा करें।";
    });
  </script>
</body>
</html>
